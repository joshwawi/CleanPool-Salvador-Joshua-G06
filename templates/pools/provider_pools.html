{% extends "base.html" %}
{% block title %}Pool Requests{% endblock %}
{% block content %}
<div class="card">
  <h1>Pools on my services</h1>
  <form method="get" style="max-width:300px">
    <label for="status">Filter by status</label>
    <select id="status" name="status" onchange="this.form.submit()">
      <option value="">All</option>
      {% for v, l in status_choices %}<option value="{{ v }}" {% if v == status %}selected{% endif %}>{{ l }}</option>{% endfor %}
    </select>
  </form>
  <div style="margin-top:1rem">{% include "pools/_pool_table.html" %}</div>
</div>
{% endblock %}
