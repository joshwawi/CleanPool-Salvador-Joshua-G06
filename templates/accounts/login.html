{% extends "base.html" %}
{% block title %}Log in – CleanPool{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:auto">
  <h1>Log in</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form.html" %}
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="help">No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
</div>
{% endblock %}
